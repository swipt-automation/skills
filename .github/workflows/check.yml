name: Check

on:
  pull_request:
    branches: [source]

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: sources/swipt
      - run: bun run --cwd cli build
        working-directory: sources/swipt
      - run: bun generate
      - run: bun generate --check
